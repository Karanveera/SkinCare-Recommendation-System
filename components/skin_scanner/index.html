<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #05070c; color: #f8fafc; overflow: hidden;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  button { font-family: inherit; cursor: pointer; }

  #app { position: relative; display: flex; height: 100%; width: 100%; overflow: hidden; }

  /* ---------- Left: camera + controls ---------- */
  #left { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 14px; gap: 12px; }
  #stage { position: relative; flex: 1; min-height: 0; background: #000; border-radius: 20px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.14); box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  #video, #photo { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: cover; transform: scaleX(-1); }
  #photo { object-fit: contain; background: #000; }

  #guide { position: absolute; left: 50%; top: 50%; width: min(46%, 340px); aspect-ratio: 3 / 4; max-height: 78%;
    transform: translate(-50%, -50%); border: 2px dashed rgba(56,189,248,.55); border-radius: 50%; pointer-events: none; }
  #scanline { position: absolute; left: 0; right: 0; height: 3px; top: 0; pointer-events: none;
    background: linear-gradient(90deg, transparent, #38bdf8, transparent); box-shadow: 0 0 18px 4px rgba(56,189,248,.7);
    animation: sweep 1.6s ease-in-out infinite alternate; }
  @keyframes sweep { from { top: 6%; } to { top: 94%; } }

  #brand { position: absolute; top: 14px; left: 14px; display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px;
    background: rgba(15,23,42,.7); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; backdrop-filter: blur(12px); }
  #brand .icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px;
    background: linear-gradient(135deg, #0284c7, #3b82f6); }
  #brand b { font-size: 14px; font-weight: 800; }
  #brand .tag { font-size: 10px; font-weight: 800; color: #0f172a; background: #38bdf8; padding: 2px 6px; border-radius: 6px; margin-left: 6px; }

  #closeBtn { position: absolute; top: 14px; right: 14px; width: 42px; height: 42px; border-radius: 50%; font-size: 24px; line-height: 1;
    color: #fff; background: rgba(15,23,42,.75); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(12px);
    display: grid; place-items: center; transition: background .15s, transform .15s; }
  #closeBtn:hover { background: #e11d48; transform: scale(1.06); }

  #liveBtn { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 13px; font-weight: 700;
    color: #fff; background: rgba(15,23,42,.8); border: 1px solid rgba(255,255,255,.22); border-radius: 20px; backdrop-filter: blur(12px); }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.go { animation: flash .35s ease-out; }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }

  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    text-align: center; padding: 24px; background: rgba(5,7,12,.82); }
  .overlay p { max-width: 360px; font-size: 14px; color: #cbd5e1; line-height: 1.5; }
  .overlay .big { font-size: 18px; font-weight: 800; color: #fff; }
  #analyzing { background: rgba(5,7,12,.35); justify-content: flex-end; padding-bottom: 28px; pointer-events: none; }
  #analyzing .chip { padding: 9px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; background: rgba(15,23,42,.85);
    border: 1px solid rgba(56,189,248,.5); color: #7dd3fc; }

  /* Control bar under the camera */
  #bar { display: flex; justify-content: center; gap: 12px; padding: 4px 0 2px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 180px; padding: 13px 26px;
    font-size: 15px; font-weight: 700; color: #fff; border-radius: 28px; border: 1px solid rgba(255,255,255,.2); transition: transform .12s, opacity .12s; }
  .btn:hover:not(:disabled) { transform: translateY(-1px); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(135deg, #0284c7, #2563eb 50%, #4f46e5); box-shadow: 0 6px 22px rgba(37,99,235,.5); }
  .btn.secondary { background: rgba(30,41,59,.9); }
  .btn.secondary:hover:not(:disabled) { background: rgba(51,65,85,.95); }

  /* ---------- Right: recommendations ---------- */
  #panel { position: absolute; top: 0; right: 0; bottom: 0; width: 400px; max-width: 100%; z-index: 20; display: flex; flex-direction: column;
    background: rgba(11,15,25,.97); border-left: 1px solid rgba(255,255,255,.12); box-shadow: -12px 0 40px rgba(0,0,0,.55);
    transform: translateX(105%); visibility: hidden; transition: transform .28s ease, visibility 0s linear .28s; }
  #panel.open { transform: none; visibility: visible; transition: transform .28s ease; }
  #panelHead { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 14px 20px; font-size: 16px; font-weight: 800;
    border-bottom: 1px solid rgba(255,255,255,.1); }
  #panelClose { width: 36px; height: 36px; border-radius: 50%; font-size: 22px; line-height: 1; color: #fff; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.18); display: grid; place-items: center; transition: background .15s; }
  #panelClose:hover { background: #e11d48; }
  .loading { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #7dd3fc; font-size: 14px; font-weight: 700; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(56,189,248,.25); border-top-color: #38bdf8; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #panelBody { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
  #panelBody::-webkit-scrollbar { width: 6px; }
  #panelBody::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 3px; }
  .empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; color: #94a3b8; font-size: 14px; line-height: 1.55; padding: 0 12px; }
  .empty .emoji { font-size: 40px; }

  h4 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; margin: 20px 0 10px; }
  .card { background: rgba(30,41,59,.6); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px; }
  .score-label { font-size: 12px; color: #94a3b8; }
  .score { font-size: 34px; font-weight: 800; margin-top: 2px; }
  .score small { font-size: 14px; color: #64748b; font-weight: 600; }
  .bar-track { height: 6px; background: rgba(255,255,255,.1); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; }

  .issue { background: rgba(15,23,42,.75); border-left: 3px solid #06b6d4; border-radius: 10px; padding: 11px 13px; margin-bottom: 10px; }
  .issue.acne { border-left-color: #f43f5e; }
  .issue.clear { border-left-color: #10b981; }
  .issue .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .issue .title { font-size: 14px; font-weight: 700; }
  .issue .desc { font-size: 12px; color: #94a3b8; margin-top: 4px; line-height: 1.45; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; color: #38bdf8; background: rgba(56,189,248,.15); }
  .issue.acne .badge { color: #fb7185; background: rgba(244,63,94,.15); }
  .issue.clear .badge { color: #34d399; background: rgba(16,185,129,.15); }

  .product { background: rgba(30,41,59,.5); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 13px; margin-bottom: 12px; }
  .product .ptag { font-size: 10.5px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: .04em; }
  .product .pname { font-size: 14.5px; font-weight: 700; margin-top: 3px; }
  .product .pmeta { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .product .pwhy { font-size: 12px; color: #a8b3c4; margin-top: 7px; line-height: 1.45; }
  .pill { display: inline-block; font-size: 11px; color: #cbd5e1; background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 5px; margin: 7px 4px 0 0; }
  .product .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 11px; }
  .price { font-size: 18px; font-weight: 800; color: #38bdf8; }
  a.buy { font-size: 12.5px; font-weight: 700; color: #0f172a; background: #38bdf8; padding: 7px 13px; border-radius: 8px; text-decoration: none; }
  a.buy:hover { background: #7dd3fc; }
  .error { color: #fda4af; background: rgba(244,63,94,.12); border: 1px solid rgba(244,63,94,.35); border-radius: 12px; padding: 12px; font-size: 13px; }

  [hidden] { display: none !important; }

  /* ---------- Small screens: recommendations slide up as a bottom sheet ---------- */
  @media (max-width: 860px) {
    #left { padding: 10px; gap: 10px; }
    #panel { top: auto; left: 0; width: 100%; height: 68%; border-left: 0; border-top: 1px solid rgba(255,255,255,.12);
      border-radius: 20px 20px 0 0; transform: translateY(105%); }
    #panel.open { transform: none; }
    .btn { min-width: 0; flex: 1; padding: 12px 14px; font-size: 14px; }
    #brand .tag, #brand b { font-size: 12px; }
    #guide { width: 52%; }
  }
</style>
</head>
<body>
<div id="app">
  <section id="left">
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <img id="photo" alt="Chosen photo" hidden>
      <div id="guide"></div>
      <div id="scanline" hidden></div>
      <div id="flash"></div>

      <div id="brand"><div class="icon">👁️</div><div><b>DermaVision AI</b><span class="tag">Live</span></div></div>
      <button id="closeBtn" type="button" aria-label="Close camera" title="Close">×</button>
      <button id="liveBtn" type="button" hidden>📷 Back to camera</button>

      <div id="analyzing" class="overlay" hidden><div class="chip">🔬 Analyzing your skin…</div></div>

      <div id="camError" class="overlay" hidden>
        <div class="big">Camera unavailable</div>
        <p id="camErrorText">Allow camera access in your browser, or use “Choose Photo” instead.</p>
        <button class="btn secondary" id="retryCam" type="button">Try again</button>
      </div>

      <div id="closed" class="overlay" hidden style="background:#05070c">
        <div style="font-size:42px">👁️</div>
        <div class="big">Camera closed</div>
        <p>Your camera is off. Start it again to run a new scan.</p>
        <button class="btn primary" id="reopen" type="button">Start camera</button>
      </div>
    </div>

    <div id="bar">
      <button class="btn primary" id="scanBtn" type="button">⚡ Face Scan</button>
      <button class="btn secondary" id="photoBtn" type="button">🖼️ Choose Photo</button>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
    </div>
  </section>

  <aside id="panel">
    <div id="panelHead"><span>📊 Analysis &amp; Recommendations</span>
      <button id="panelClose" type="button" aria-label="Close recommendations" title="Close">×</button></div>
    <div id="panelBody"></div>
  </aside>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), photo = $('photo'), scanBtn = $('scanBtn'), photoBtn = $('photoBtn'), fileInput = $('file');
  var stream = null, mode = 'camera', pendingId = null, shownResultId = null, pendingTimer = null;

  /* ---------- Streamlit component protocol (no build step needed) ---------- */
  function send(type, data) {
    var msg = { isStreamlitMessage: true, type: type };
    for (var k in data) msg[k] = data[k];
    window.parent.postMessage(msg, '*');
  }
  function setValue(v) { send('streamlit:setComponentValue', { value: v, dataType: 'json' }); }

  /* ---------- Camera ---------- */
  function show(el, on) { el.hidden = !on; }

  function startCamera() {
    show($('camError'), false);
    if (stream) return Promise.resolve();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return Promise.reject(new Error('This browser does not support camera access (HTTPS or localhost is required).'));
    }
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    }).then(function (s) { stream = s; video.srcObject = s; return video.play().catch(function () {}); });
  }
  function stopCamera() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
  }
  function camFail(err) {
    var name = err && err.name;
    $('camErrorText').textContent =
      name === 'NotAllowedError' ? 'Camera permission was blocked. Allow it in your browser’s address bar, or use “Choose Photo”.' :
      name === 'NotFoundError' ? 'No camera was found on this device. Use “Choose Photo” instead.' :
      (err && err.message) || 'Could not start the camera. Use “Choose Photo” instead.';
    show($('camError'), true);
    closePanel();
  }

  function showCameraView() {
    mode = 'camera';
    show(video, true); show(photo, false); show($('guide'), true); show($('liveBtn'), false); show($('closed'), false);
  }
  function showPhotoView(src) {
    mode = 'photo';
    photo.src = src;
    show(video, false); show(photo, true); show($('guide'), false); show($('liveBtn'), true); show($('camError'), false);
  }

  /* ---------- Scanning ---------- */
  function setBusy(on) {
    show($('analyzing'), on); show($('scanline'), on);
    scanBtn.disabled = on; photoBtn.disabled = on;
    clearTimeout(pendingTimer);
    if (on) pendingTimer = setTimeout(function () { setBusy(false); pendingId = null; renderResult({ error: 'The scan timed out. Please try again.' }); }, 60000);
  }
  function submitImage(dataUrl) {
    pendingId = Date.now();
    renderLoading(); openPanel();
    setBusy(true);
    setValue({ id: pendingId, action: 'scan', image: dataUrl });
  }

  function captureFrame() {
    var w = video.videoWidth, h = video.videoHeight;
    if (!w || !h) return null;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;               // native resolution: the model uses absolute pixel areas
    c.getContext('2d').drawImage(video, 0, 0, w, h);
    return c.toDataURL('image/jpeg', 0.92);
  }

  scanBtn.addEventListener('click', function () {
    showCameraView();
    startCamera().then(function () {
      // wait briefly for the first frames if the camera was just started
      var tries = 0;
      (function wait() {
        if (video.videoWidth && video.readyState >= 2) {
          var f = captureFrame();
          if (f) { $('flash').classList.remove('go'); void $('flash').offsetWidth; $('flash').classList.add('go'); submitImage(f); }
        } else if (tries++ < 40) { setTimeout(wait, 100); }
        else { camFail(new Error('The camera did not start in time. Try again.')); }
      })();
    }).catch(camFail);
  });

  photoBtn.addEventListener('click', function () { fileInput.value = ''; fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { showPhotoView(r.result); submitImage(r.result); };
    r.readAsDataURL(f);
  });

  $('liveBtn').addEventListener('click', function () {
    showCameraView();
    startCamera().catch(camFail);
  });

  $('retryCam').addEventListener('click', function () { startCamera().catch(camFail); });

  /* ---------- Close / reopen ---------- */
  function openPanel() { $('panel').classList.add('open'); }
  function closePanel() { $('panel').classList.remove('open'); }
  $('panelClose').addEventListener('click', closePanel);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanel(); });

  $('closeBtn').addEventListener('click', function () {
    stopCamera();
    pendingId = null; setBusy(false); closePanel();
    shownResultId = null; renderEmpty();
    show($('closed'), true); show($('camError'), false); show($('liveBtn'), false);
    setValue({ id: Date.now(), action: 'close' });
  });
  $('reopen').addEventListener('click', function () {
    showCameraView();
    startCamera().catch(camFail);
  });

  /* ---------- Recommendation panel ---------- */
  var body = $('panelBody');
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function renderLoading() {
    body.innerHTML = '<div class="loading"><div class="spinner"></div>Analyzing your skin…</div>';
  }
  function renderEmpty() {
    body.innerHTML = '<div class="empty"><div class="emoji">✨</div><div><b style="color:#e2e8f0">No scan yet</b><br>' +
      'Tap <b>Face Scan</b> to analyze your skin with the camera, or <b>Choose Photo</b> to upload one. ' +
      'Your results and product picks will appear here.</div></div>';
  }
  function renderResult(r) {
    if (r.error) { body.innerHTML = '<div class="error">⚠️ ' + esc(r.error) + '</div>'; return; }
    var score = r.score, color = score >= 80 ? '#10b981' : (score >= 60 ? '#f59e0b' : '#f43f5e');
    var h = '<div class="card"><div class="score-label">Facial Health Score</div>' +
      '<div class="score" style="color:' + color + '">' + esc(score) + ' <small>/ 100</small></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + Math.max(0, Math.min(100, score)) + '%;background:' + color + '"></div></div></div>';

    h += '<h4>Identified Skin Conditions</h4>';
    if (!r.issues.length) {
      h += '<div class="issue clear"><div class="row"><div class="title">✨ Clear &amp; Clean Skin</div><span class="badge">Clear (0%)</span></div>' +
        '<div class="desc">No active acne breakouts detected. Skin barrier is clean and healthy!</div></div>';
    } else {
      r.issues.forEach(function (i) {
        h += '<div class="issue ' + (i.key === 'acne' ? 'acne' : '') + '"><div class="row"><div class="title">' + esc(i.name) +
          '</div><span class="badge">' + esc(i.severityText) + '</span></div><div class="desc">' + esc(i.description) + '</div></div>';
      });
    }

    h += '<h4>Targeted Skincare Routine</h4>';
    r.products.forEach(function (p) {
      h += '<div class="product"><div class="ptag">' + esc(p.tag) + '</div>' +
        '<div class="pname">' + esc(p.icon) + ' ' + esc(p.name) + '</div>' +
        '<div class="pmeta">' + esc(p.brand) + ' • ' + esc(p.category) + '</div>' +
        '<div class="pwhy">' + esc(p.whyItHelps) + '</div><div>' +
        (p.activeIngredients || []).map(function (a) { return '<span class="pill">' + esc(a) + '</span>'; }).join('') +
        '</div><div class="foot"><div class="price">' + esc(p.price) + '</div>' +
        '<a class="buy" href="' + esc(p.buyUrl) + '" target="_blank" rel="noopener noreferrer">View Product ↗</a></div></div>';
    });
    body.innerHTML = h;
    body.scrollTop = 0;
  }

  /* ---------- Render events from Streamlit ---------- */
  var started = false;
  window.addEventListener('message', function (ev) {
    if (!ev.data || ev.data.type !== 'streamlit:render') return;
    var res = (ev.data.args || {}).result;
    if (res && res.id !== shownResultId) {
      shownResultId = res.id;
      var mine = res.id === pendingId;
      renderResult(res);
      if (mine) { pendingId = null; setBusy(false); openPanel(); }
    } else if (!res && !pendingId && shownResultId === null) {
      renderEmpty();
    }
    if (!started) { started = true; startCamera().catch(camFail); }
  });

  renderEmpty();
  send('streamlit:componentReady', { apiVersion: 1 });
  send('streamlit:setFrameHeight', { height: 600 });
  window.addEventListener('pagehide', stopCamera);
})();
</script>
</body>
</html>
